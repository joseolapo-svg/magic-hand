<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comparación de Planes - Membresías Grupales</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Encabezado Adhesivo -->
    <header>
        <a href="index.html" class="logo">MembresíasGrupales</a>
        <ul class="nav-links">
            <li><a href="index.html">Inicio</a></li>
            <li><a href="comparacion.html">Compara</a></li>
        </ul>
    </header>

    <!-- Tabla Comparativa -->
    <section class="comparison-section" style="margin-top: 160px;">
        <h2>Tabla Comparativa de Características</h2>
        <table>
            <thead>
                <tr>
                    <th>Característica</th>
                    <th>Plan Básico</th>
                    <th>Plan Pro</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Precio mensual</td>
                    <td>$29</td>
                    <td>$59</td>
                </tr>
                <tr>
                    <td>Soporte técnico</td>
                    <td>Estándar (48h)</td>
                    <td>Prioritario 24/7</td>
                </tr>
                <tr>
                    <td>Acceso a herramientas</td>
                    <td>Limitado</td>
                    <td>Ilimitado</td>
                </tr>
                <tr>
                    <td>Personalización</td>
                    <td>No disponible</td>
                    <td>Completa</td>
                </tr>
            </tbody>
        </table>
        <div style="text-align: center; margin-top: 40px;">
            <a href="index.html" class="cta-btn" style="display: inline-block; width: 200px;">Volver al Inicio</a>
        </div>
    </section>

</body>
</html>
